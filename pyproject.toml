[project]
name = "telegram-budget-bot"
version = "0.1.0"
description = "Invite-only Telegram virtual INR budget tracker"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=22,<23",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "openai>=2,<3",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "SQLAlchemy>=2,<3",
  "psycopg[binary,pool]>=3,<4",
  "alembic>=1,<2",
  "python-dotenv>=1,<2",
  "tzdata>=2025",
]

[project.scripts]
budget-bot = "budget_bot.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "hypothesis>=6", "ruff>=0.12", "build>=1", "pip-audit>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budget_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires isolated project PostgreSQL test database"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
